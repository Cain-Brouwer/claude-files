<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Opdracht 2: Counter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/grid.css">
    <link rel="stylesheet" href="../style.css">
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-12" id="buttons">
          <div class="subtraction col-3">
            <button data-action="subtract" class="subtract10" value="10">-10</button>
            <button data-action="subtract" class="subtract1" value="1">-1</button>
          </div>
          <div class="addition col-3">
            <button data-action="add" class="add1" value="1">+1</button>
            <button data-action="add" class="add10" value="10">+10</button>
          </div>
        </div>
        <div class="col-4 row-2">
          <div id="counter">0</div>
          <button data-action="reset" id="reset" value="0">Klik om te resetten</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
